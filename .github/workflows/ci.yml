name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Only test the newest version of a PR branch, avoiding parallel Chromium
# runs competing for GPU/software-rendering resources on shared CI runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    # Chromium browser tests usually complete within ~15 minutes. Bound
    # stalled runner/bootstrap work rather than leaving a PR in CI for hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
